apply plugin: 'com.android.application'

android {
    namespace 'com.autov.trader'
    compileSdk 34

    defaultConfig {
        applicationId "com.autov.trader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug  // sideload-friendly; replace for store builds
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // none — pure framework WebView client
}

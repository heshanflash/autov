// AutoV Trader — Android Studio / Gradle build (optional).
// The zero-Gradle pipeline lives in build_apk.sh (works with only a JRE + Android SDK bits).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
